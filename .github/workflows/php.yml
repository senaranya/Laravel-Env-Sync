name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  COVERAGE_PHP_VERSION: '8.3' # The primary PHP version used for code coverage uploads

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        php-versions: [ '8.2', '8.3', '8.4', '8.5' ]
    name: PHP ${{ matrix.php-versions }} Test on ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP and Tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpcs
          coverage: ${{ matrix.php-versions == env.COVERAGE_PHP_VERSION && 'xdebug' || 'none' }}

      - name: Check PHP Version
        run: php -v

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run linter
        run: phpcs

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite (with coverage)
        if: matrix.php-versions == env.COVERAGE_PHP_VERSION
        run: ./vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover

      - name: Run test suite (without coverage)
        if: matrix.php-versions != env.COVERAGE_PHP_VERSION
        run: ./vendor/bin/phpunit

      - name: Upload coverage to Codecov
        if: matrix.php-versions == env.COVERAGE_PHP_VERSION
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.clover
